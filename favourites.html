<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Compare - Favourites</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="header">
        <div class="logo-container">
            <img src="https://via.placeholder.com/60x60/FF6B35/FFFFFF?text=AC" alt="Auto Compare Logo" class="logo">
            <h1>Auto Compare</h1>
        </div>
        <nav class="navigation">
            <a href="home.html" class="nav-link">Home</a>
            <a href="compare.html" class="nav-link">Compare</a>
            <a href="favourites.html" class="nav-link active">Favourites</a>
            <a href="feedback.html" class="nav-link">Feedback</a>
            <a href="login.html" class="nav-link logout">Logout</a>

    </header>

    <main class="favourites-main">
        <h2>Your Favourite Cars</h2>
        
        <div id="favouritesList" class="favourites-list">
            <!-- Favourite cars will be displayed here -->
        </div>

        <div id="noFavourites" class="no-favourites" style="display: none;">
            <h3>There are no favourites</h3>
            <p>Start comparing cars and add them to your favourites!</p>
            <a href="compare.html" class="btn">Compare Cars</a>
        </div>
    </main>

    <script src="script.js"></script>
    <script src="carData.js"></script>
