<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Compare - Login</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="login-body">
    <div class="login-container">
        <div class="login-form" id="loginForm">
            <h2>Auto Compare</h2>
            <h3>Login to your account</h3>
            <form>
                <div class="input-group">
                    <input type="email" placeholder="Email" required>
                </div>
                <div class="input-group">
                    <input type="password" placeholder="Password" required>
                </div>
                <button type="submit" class="login-btn" onclick="login()">Login</button>
            </form>
            <div class="login-links">
                <a href="#" onclick="showForgotPassword()">Forgotten Password?</a>
                <a href="#" onclick="showCreateAccount()">Don't have an account? Create one</a>
            </div>
        </div>

        <div class="forgot-password-form" id="forgotPasswordForm" style="display: none;">
            <h2>Auto Compare</h2>
            <h3>Reset Password</h3>
            <form>
                <div class="input-group">
                    <input type="email" placeholder="Enter your email" required>
                </div>
                <button type="submit" class="login-btn">Send Reset Link</button>
            </form>
            <div class="login-links">
                <a href="#" onclick="showLogin()">Back to Login</a>
            </div>
        </div>

        <div class="create-account-form" id="createAccountForm" style="display: none;">
            <h2>Auto Compare</h2>
            <h3>Create Account</h3>
            <form>
                <div class="input-group">
                    <input type="text" placeholder="Full Name" required>
                </div>
                <div class="input-group">
                    <input type="email" placeholder="Email" required>
                </div>
                <div class="input-group">
                    <input type="password" placeholder="Password" required>
                </div>
                <div class="input-group">
                    <input type="password" placeholder="Confirm Password" required>
                </div>
                <button type="submit" class="login-btn">Create Account</button>
            </form>
            <div class="login-links">
                <a href="#" onclick="showLogin()">Already have an account? Login</a>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
